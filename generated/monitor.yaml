apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: payments-service-incident-guardrails
spec:
  groups:
    - name: payments-service.risk
      rules:
        - alert: CheckoutLatencyCritical
          expr: histogram_quantile(0.99, rate(payments_checkout_duration_seconds_bucket[5m])) > 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Checkout p99 latency is above incident threshold"
            description: "payments.checkout.p99 latency above 2s with elevated DB CPU and repeated product queries."
            runbook_url: "https://runbooks.example.com/payments-service"
        - alert: CheckoutLatencyWarning
          expr: histogram_quantile(0.99, rate(payments_checkout_duration_seconds_bucket[5m])) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Checkout p99 latency is elevated"
            description: "Early warning for recurring payments-service incident pattern."
            runbook_url: "https://runbooks.example.com/payments-service"
