[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postmortem-memory-agent"
version = "0.1.0"
description = "Semantic memory layer for incident response — compress postmortems, generate artifacts, block risky PRs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
pma = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
